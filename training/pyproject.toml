[project]
name = "datafactory-ego-quality"
version = "0.1.0"
description = "Offline YOLO26 training for Ego video quality"
requires-python = ">=3.11"
dependencies = [
    "ultralytics==8.4.203",
    "torch>=2.9,<3",
    "torchvision>=0.24,<1",
    "boto3>=1.40,<2",
    "pyyaml>=6.0.3,<7",
    "tzdata>=2025.2",
]

[project.scripts]
ego-quality-train = "ego_quality.train:main"

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ego_quality"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

# PyTorch 由 uv 按本机驱动选择后端，其他依赖继续使用阿里云镜像。
[tool.uv.pip]
torch-backend = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
