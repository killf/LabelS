[project]
name = "labels"
version = "2.0.0"
description = "LabelS local image annotation and YOLO training"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "shenguanlin", email = "shenguanlin@pjlab.org.cn" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "loguru>=0.6.0",
    "sqlalchemy>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "click>=8.0",
    "uvicorn>=0.19.0",
    "email-validator>=2.0.0",
    "python-multipart>=0.0.5",
    "python-dotenv>=0.21.0",
    "aiofiles>=22.1.0",
    "pillow>=9.3.0",
    "pyyaml>=6.0,<7",
    "alembic>=1.9.4",
    "httpx>=0.27.0",
    "websockets>=10.0.0",
    "bcrypt==4.3.0",
]

[project.optional-dependencies]
mysql = [
    "mysqlclient>=2.1.1",
]

training = [
    "ultralytics==8.4.203",
    "torch>=2.9,<3",
    "torchvision>=0.24,<1",
    "pyyaml>=6.0.3,<7",
    "tzdata>=2025.2",
]

[project.urls]
repository = "https://github.com/killf/LabelS"

[project.scripts]
labels = "backend.main:cli"
labels-train = "backend.training.train:main"

[dependency-groups]
dev = [
    "black>=22.10.0",
    "flake8>=5.0.4",
]
test = [
    "pytest>=7.2.0",
    "pytest-cov>=4.0.0",
    "requests>=2.28.1",
]

[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
only-include = [
    "__init__.py", "main.py", "version.py",
    "adapter", "application", "clients", "common", "dependencies",
    "domain", "middleware", "statics", "migrations", "training",
]
sources = {"" = "backend"}
exclude = ["**/__pycache__/**", "**/.env", "**/.env.*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py311"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.uv.pip]
torch-backend = "auto"
